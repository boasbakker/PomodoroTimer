<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <title>Pomodoro</title>
    <link rel="stylesheet" href="tab.css" />
</head>

<body>
    <main class="app">
        <header class="top">
            <div>
                <p class="eyebrow">Zen Pomodoro</p>
                <h1 id="topTextDisplay">Customizable Pomodoro timer</h1>
                <p id="todayLine" class="subdued">Today</p>
            </div>
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">Worked</span>
                    <span id="workedTotal" class="stat-value">0h</span>
                </div>
            </div>
        </header>

        <section class="timer-card">
            <div id="progressRing" class="ring">
                <div class="ring-core">
                    <p id="modeLabel" class="mode">Work</p>
                    <p id="timeLeft" class="timer">25:00</p>
                    <p id="statusLine" class="status">Ready</p>
                </div>
            </div>
            <div class="controls">
                <button id="toggleBtn" class="btn primary">Start</button>
                <button id="shorterBtn" class="btn ghost" hidden>−1 min</button>
                <button id="plusOneBtn" class="btn ghost" hidden>+1 (<span id="plusOneRemaining">0</span> left)</button>
                <button id="resetBtn" class="btn ghost" hidden>
                    <span class="hold-btn-label">Reset</span>
                </button>
                <button id="alarmStartBtn" class="btn primary alarm-cta hold-btn" hidden>
                    <span class="hold-btn-label">Hold to start Work</span>
                </button>
            </div>
            <p id="messageLine" class="message" aria-live="polite"></p>
        </section>

        <section class="profile-card">
            <header class="profile-header">
                <h2>Profiles</h2>
                <button id="newProfileBtn" class="btn primary">+ New profile</button>
            </header>
            <ul id="profileList" class="profile-list"></ul>
            <div class="profile-footer">
                <button id="defaultsBtn" class="btn ghost">Restore defaults</button>
            </div>
        </section>
    </main>

    <div id="profileModal" class="modal" hidden aria-modal="true" role="dialog" aria-labelledby="modalTitle">
        <div class="modal-backdrop" data-close></div>
        <div class="modal-card">
            <header class="modal-header">
                <h3 id="modalTitle">Edit profile</h3>
                <button class="modal-close" data-close aria-label="Close">&times;</button>
            </header>
            <div class="modal-body">
                <label class="field">
                    <span>Name</span>
                    <input id="nameInput" type="text" />
                </label>
                <label class="field">
                    <span>Top text</span>
                    <input id="topTextInput" type="text" placeholder="Customizable Pomodoro timer" />
                </label>
                <div class="field-grid">
                    <label class="field">
                        <span>Work (min)</span>
                        <input id="workInput" type="number" min="1" />
                    </label>
                    <label class="field">
                        <span>Short break (min)</span>
                        <input id="shortBreakInput" type="number" min="1" />
                    </label>
                    <div class="field">
                        <span class="field-label-row">
                            <label for="longEveryInput">Long break every</label>
                            <button type="button" id="longEveryInfo" class="info-btn" aria-label="What does 'Long break every' mean?">
                                <span aria-hidden="true">i</span>
                                <span class="info-tooltip" role="tooltip">After every N work sessions, the next break is a long break instead of a short one. With N = 4: short, short, short, long &mdash; then repeat.</span>
                            </button>
                        </span>
                        <input id="longEveryInput" type="number" min="1" />
                    </div>
                    <label class="field">
                        <span>Long break (min)</span>
                        <input id="longBreakInput" type="number" min="1" />
                    </label>
                    <label class="field">
                        <span>Alarm hold (s)</span>
                        <input id="alarmHoldInput" type="number" min="1" max="30" step="1" />
                    </label>
                </div>
                <p id="modalError" class="modal-error" aria-live="polite"></p>
            </div>
            <footer class="modal-footer">
                <button id="modalDeleteBtn" class="btn ghost hold-btn danger" hidden>
                    <span class="hold-btn-label">Hold to delete</span>
                </button>
                <span class="modal-spacer"></span>
                <button id="modalCancelBtn" class="btn ghost" data-close>Cancel</button>
                <button id="modalSaveBtn" class="btn primary">Save</button>
            </footer>
        </div>
    </div>

    <div id="confirmModal" class="modal" hidden aria-modal="true" role="dialog" aria-labelledby="confirmTitle">
        <div class="modal-backdrop" data-confirm-close></div>
        <div class="modal-card modal-card-sm">
            <header class="modal-header">
                <h3 id="confirmTitle">Are you sure?</h3>
            </header>
            <div class="modal-body">
                <p id="confirmMessage" class="confirm-message"></p>
            </div>
            <footer class="modal-footer">
                <span class="modal-spacer"></span>
                <button id="confirmCancelBtn" class="btn ghost" data-confirm-close>Cancel</button>
                <button id="confirmOkBtn" class="btn primary">Confirm</button>
            </footer>
        </div>
    </div>

    <script src="tab.js"></script>
</body>

</html>
